    <!-- Dynamic Domain Adaptation Script for SEO (instantly maps canonical & social URLs to any registered custom domain) -->
    <script>
      (function() {
        try {
          if (typeof window === 'undefined') return;
          var origin = window.location.origin;
          if (!origin || origin.indexOf('http') !== 0) return;

          // 1. Update Canonical Link
          var canonicalLink = document.getElementById('seo-canonical-link');
          if (canonicalLink) {
            canonicalLink.setAttribute('href', origin + window.location.pathname);
          }

          // 2. Update OpenGraph URL and Image
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) {
            ogUrl.setAttribute('content', origin + window.location.pathname);
          }
          var ogImage = document.querySelector('meta[property="og:image"]');
          if (ogImage) {
            ogImage.setAttribute('content', origin + '/og-image.jpg');
          }
          var ogImageSecure = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogImageSecure) {
            ogImageSecure.setAttribute('content', origin + '/og-image.jpg');
          }
          var twitterImage = document.querySelector('meta[name="twitter:image"]');
          if (twitterImage) {
            twitterImage.setAttribute('content', origin + '/og-image.jpg');
          }

          // 3. Update Schema.org JSON-LD structured data URLs dynamically to match active domain
          var schemaScript = document.getElementById('seo-structured-data');
          if (schemaScript && schemaScript.textContent) {
            var schemaText = schemaScript.textContent;
            var updated = schemaText.replace(/https:\/\/sokopos\.co\.ke/g, origin);
            schemaScript.textContent = updated;
          }
        } catch (e) {
          console.warn('SEO dynamic domain adjustment notice:', e);
        }
      })();
    </script>

    <script>
      (function() {
        try {
          if (typeof window === 'undefined' || !window.localStorage) return;
          var storage = window.localStorage;
          var originalSetItem = storage.setItem.bind(storage);

          // Clear lingering Firestore multi-client synchronization artifacts
          var staleKeys = [];
          for (var i = 0; i < storage.length; i++) {
            var k = storage.key(i);
            if (k && (k.indexOf('firestore_clients_') === 0 || k.indexOf('firestore_mutations_') === 0 || k.indexOf('firestore_') === 0)) {
              staleKeys.push(k);
            }
          }
          for (var j = 0; j < staleKeys.length; j++) {
            try { storage.removeItem(staleKeys[j]); } catch(e) {}
          }

          storage.setItem = function(key, val) {
            try {
              originalSetItem(key, val);
            } catch(err) {
              var isQuota = err && (err.name === 'QuotaExceededError' || err.code === 22 || (err.message && err.message.indexOf('quota') !== -1));
              if (isQuota) {
                try {
                  var evict = [];
                  for (var idx = 0; idx < storage.length; idx++) {
                    var ik = storage.key(idx);
                    if (!ik) continue;
                    if (
                      ik.indexOf('firestore_') === 0 ||
                      ik.indexOf('sales_backups') !== -1 ||
                      ik.indexOf('sync_logs') !== -1 ||
                      ik.indexOf('admin_activity_logs') !== -1 ||
                      ik.indexOf('supervisor_overrides') !== -1 ||
                      ik.indexOf('sa_audit') !== -1 ||
                      ik.indexOf('login_bg_graphic') !== -1 ||
                      ik.indexOf('platform_logo') !== -1
                    ) {
                      evict.push(ik);
                    }
                  }
                  for (var r = 0; r < evict.length; r++) {
                    try { storage.removeItem(evict[r]); } catch(e) {}
                  }
                  originalSetItem(key, val);
                  return;
                } catch(retryErr) {
                  // Suppress quota crash so Firestore and state machines continue seamlessly
                  return;
                }
              }
              throw err;
            }
          };
        } catch(e) {}
      })();
    </script>
